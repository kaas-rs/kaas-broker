{{- if .Values.observability.alerts.enabled }}
{{- /*
Phase 10 Gap #7: PrometheusRule for kaas's load-bearing failure
modes. Off by default — opt in via observability.alerts.enabled.

Each rule's "summary" + "description" annotations are written so an
operator hitting Alertmanager has enough context to start an
investigation without reading the source. Rules are warnings unless
they sustain.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kaas.fullname" . }}
  labels:
    {{- include "kaas.labels" . | nindent 4 }}
    {{- with .Values.observability.alerts.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kaas.coordination
      interval: 30s
      rules:
        - alert: KaasSelfFencing
          expr: sum by (broker_id) (rate(kaas_self_fence_events_total[1m])) * 60 > {{ .Values.observability.alerts.thresholds.selfFencePerMinute }}
          for: 2m
          labels:
            severity: warning
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Broker {{`{{ $labels.broker_id }}`}} is self-fencing on stale heartbeats"
            description: |
              kaas_self_fence_events_total exceeded {{ .Values.observability.alerts.thresholds.selfFencePerMinute }}/min for 2 minutes.
              The broker has lost connectivity to the controller; produces are
              being rejected with NOT_LEADER_FOR_PARTITION. Check
              kaas_heartbeat_rtt_seconds and the controller's
              kaas_assignment_pushes_total — likely a network partition or
              controller pod issue.

        - alert: KaasStaleControllerWriting
          expr: sum by (broker_id) (rate(kaas_stale_assignments_rejected_total[1m])) * 60 > {{ .Values.observability.alerts.thresholds.staleAssignmentsPerMinute }}
          for: 5m
          labels:
            severity: critical
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Stale controller still writing assignment.json (broker {{`{{ $labels.broker_id }}`}} rejecting)"
            description: |
              An ex-controller whose lease expired is still writing assignment.json.
              The epoch fence is rejecting these files (correctly), but the
              ex-controller pod should be restarted or its grpc server killed
              to stop the noise. Check Lease holder identity vs the broker that's
              still calling FileStore.Write.

        - alert: KaasNoCurrentController
          expr: sum(kaas_is_controller) == 0
          for: 30s
          labels:
            severity: critical
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "No broker holds the cluster controller lease"
            description: |
              sum(kaas_is_controller) == 0 — the cluster has no active
              controller. Brokers can still serve produce/fetch on existing
              assignments, but no rebalance, topic creation, or broker
              join/leave will be processed until election succeeds.
              Check the kube Lease object kaas-controller and the broker
              pods' leader election logs.

        - alert: KaasBrokerCountMismatch
          expr: max(kaas_broker_count_alive) - max(kaas_broker_count_assigned) > 0
          for: 5m
          labels:
            severity: warning
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Brokers alive but not in current assignment"
            description: |
              The controller hasn't re-balanced onto a live broker for over
              5 minutes. Possible causes: the broker isn't streaming
              heartbeats (check ConnectedBrokers in the controller's
              AssignmentLoop), or the assignment loop is stuck (check
              kaas_assignment_changes_total).

    - name: kaas.assignment_loop
      interval: 30s
      rules:
        - alert: KaasAssignmentFileWriteFailing
          expr: rate(kaas_assignment_file_writes_total{result="error"}[5m]) > 0
          for: 2m
          labels:
            severity: critical
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "AssignmentStore.Write failures on {{`{{ $labels.broker_id }}`}}"
            description: |
              The controller can't persist assignment.json — partition
              rebalances and broker join/leave events will not propagate.
              Check the shared PVC's health (df, fsync, NFS mount status)
              and the broker pod's filesystem permissions on
              /data/__cluster.

        - alert: KaasAssignmentFileSizeApproachingCap
          expr: max(kaas_assignment_file_size_bytes) > {{ .Values.observability.alerts.thresholds.assignmentFileSizeWarnBytes }}
          for: 10m
          labels:
            severity: warning
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "assignment.json approaching the Kubernetes 1MB CR-status cap"
            description: |
              assignment.json is growing toward sizes (~1MB, roughly
              5000-8000 partitions at ~100 bytes each) where Kubernetes
              object caps would bite any CR-shaped reflection of it, and
              where write/parse latency on the shared volume starts to
              matter. The authoritative file on the PVC keeps working.

    - name: kaas.heartbeat
      interval: 30s
      rules:
        - alert: KaasHeartbeatRTTHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(kaas_heartbeat_rtt_seconds_bucket[5m]))) > {{ .Values.observability.alerts.thresholds.heartbeatRttP99Seconds }}
          for: 5m
          labels:
            severity: warning
            {{- with .Values.observability.alerts.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Heartbeat RTT p99 above {{ .Values.observability.alerts.thresholds.heartbeatRttP99Seconds }}s"
            description: |
              The broker→controller→broker round-trip is slow. Doesn't affect
              data plane directly, but high RTT eats into the 3s heartbeatTimeout
              budget — sustained values above ~1s mean self-fencing is one
              network blip away. Check inter-pod network latency and the
              controller pod's CPU.
{{- end }}
