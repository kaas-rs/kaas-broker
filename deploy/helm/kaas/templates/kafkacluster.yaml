{{- /*
KafkaCluster CR. The operator's KafkaClusterReconciler watches this and
materializes the per-broker external-listener resources from it
(cert-manager Certificate, per-broker Service, Gateway API TLSRoute).
The chart templates this CR, so
day-2 hostname / cert / replica changes flow through helm values (helm
upgrade / ArgoCD sync) — hand edits to the CR are reverted on the next
sync.

The chart still owns static infra (StatefulSet, PVC, headless Service,
RBAC, NOTES) since none of those depend on runtime decisions; the
KafkaCluster CR is purely the external-listener / cluster-shape surface.
*/ -}}
{{- /*
gh #126: the KafkaCluster CR schema still has internal/external as a
fixed map (operator-side refactor to a list is a separate
follow-up). The chart synthesizes that legacy shape from the first
type=internal + first type=external entry in .Values.listeners.
*/ -}}
{{- $internal := include "kaas.firstByType" (dict "ctx" . "type" "internal") | fromYaml -}}
{{- $external := include "kaas.firstByType" (dict "ctx" . "type" "external") | fromYaml -}}
apiVersion: kaas.rs/v1alpha1
kind: KafkaCluster
metadata:
  name: {{ include "kaas.fullname" . }}
  labels: {{- include "kaas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.broker.replicaCount }}
  storage:
    className: {{ .Values.storage.className | quote }}
    size: {{ .Values.storage.size | quote }}
  listeners:
    internal:
      port: {{ $internal.port | default 9092 }}
    {{- if $external }}
    external:
      {{- /* kaas.firstByType returns only an enabled listener, and a
      listener without an `enabled` key is enabled (gh #126). Until
      gh #291 this read the key itself, so such a listener rendered as
      `enabled: false` and the operator never made its Certificate. */}}
      enabled: true
      port: {{ $external.port }}
      hostnamePattern: {{ $external.hostnamePattern | quote }}
      {{- with $external.bootstrapHostname }}
      bootstrapHostname: {{ . | quote }}
      {{- end }}
      {{- /*
      gh #291: the StatefulSet mounts the external listener's cert from
      the <fullname>-broker-tls Secret, which only the operator's
      cert-manager Certificate creates. A missing certManager block is
      therefore a configuration error, not "off": fail with a message
      instead of a nil-pointer, and keep an explicit `enabled: false`
      (bring your own Secret) working. gateway and service are optional.
      */}}
      {{- $cm := required (printf "listeners[%s].certManager is required for an external listener: set certManager.enabled: true with an issuerRef, or certManager.enabled: false and provide the %s-broker-tls Secret yourself" $external.name (include "kaas.fullname" .)) $external.certManager }}
      {{- $gw := $external.gateway | default dict }}
      tls:
        certManager:
          enabled: {{ $cm.enabled | default false }}
          {{- if $cm.enabled }}
          {{- $issuer := required (printf "listeners[%s].certManager.issuerRef is required when certManager.enabled is true" $external.name) $cm.issuerRef }}
          issuerRef:
            name: {{ required (printf "listeners[%s].certManager.issuerRef.name is required" $external.name) $issuer.name | quote }}
            kind: {{ $issuer.kind | default "Issuer" | quote }}
          {{- end }}
      gateway:
        enabled: {{ $gw.enabled | default false }}
        {{- if $gw.enabled }}
        gatewayRef:
          name: {{ required (printf "listeners[%s].gateway.gatewayRef.name is required when gateway.enabled is true" $external.name) (dig "gatewayRef" "name" "" $gw) | quote }}
          {{- with dig "gatewayRef" "namespace" "" $gw }}
          namespace: {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- with dig "service" "annotations" dict $external }}
      service:
        annotations: {{- toYaml . | nindent 10 }}
      {{- end }}
    {{- else }}
    external:
      enabled: false
    {{- end }}
