{{- if and .Values.operator.enabled .Values.serviceAccount.operator.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaas.operatorSAName" . }}
  labels: {{- include "kaas.operatorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kaas.fullname" . }}-operator
  labels: {{- include "kaas.operatorLabels" . | nindent 4 }}
rules:
  # The operator only reads its CRs (watch + list) and writes their
  # status (server-side apply = `patch`). It never creates, edits or
  # deletes a CR, and holds no finalizers — cleanup is reconcile-time
  # plus the startup sweep.
  - apiGroups: [kaas.rs]
    resources: [kafkatopics, kafkausers, kafkaclusters]
    verbs: [get, list, watch]
  - apiGroups: [kaas.rs]
    resources:
      - kafkatopics/status
      - kafkausers/status
      - kafkaclusters/status
    verbs: [get, patch]
  # Not for finalizers (the operator sets none): the output Secrets,
  # Services, Certificates and TLSRoutes carry an ownerReference with
  # blockOwnerDeletion: true, and the OwnerReferencesPermissionEnforcement
  # admission plugin (on by default in OpenShift) only allows that with
  # `update` on the owner's finalizers subresource. KafkaTopic owns nothing.
  - apiGroups: [kaas.rs]
    resources:
      - kafkausers/finalizers
      - kafkaclusters/finalizers
    verbs: [update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    # `KubeLeaseElection` reads the Lease with `get`, creates it when
    # none exists, and renews it with a resourceVersion-conditional
    # replace (`update`).
    verbs: [get, create, update]
  # KafkaCluster controller reconciles Services and Gateway API / cert-manager resources.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [tlsroutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # gh #186: the KafkaCluster reconciler reads the Helm-owned broker
  # StatefulSet to detect CR-vs-chart replicas drift before fanning out
  # per-broker Services.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kaas.fullname" . }}-operator
  labels: {{- include "kaas.operatorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kaas.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "kaas.operatorSAName" . }}
    namespace: {{ .Release.Namespace }}
---
# Own-namespace Role: Secrets CRUD for output credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaas.fullname" . }}-operator
  labels: {{- include "kaas.operatorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaas.fullname" . }}-operator
  labels: {{- include "kaas.operatorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaas.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "kaas.operatorSAName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
