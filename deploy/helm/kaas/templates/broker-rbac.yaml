{{- if .Values.serviceAccount.broker.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaas.brokerSAName" . }}
  labels: {{- include "kaas.labels" . | nindent 4 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kaas.fullname" . }}-broker
  labels: {{- include "kaas.labels" . | nindent 4 }}
rules:
  # Controller election + epoch watch via Leases. The broker
  # acquires/renews/releases the kaas-controller Lease with a
  # resourceVersion-conditional replace (`update`), creates it when
  # absent, and polls it with `get` — it never lists or watches.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  # Cluster topology.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # KafkaUser: admin-protocol writes only. Brokers don't watch the CR —
  # they read the operator's acls.json / credentials.json off the
  # volume. CreateAcls/DeleteAcls (gh #107) get + replace (`update`)
  # spec.authorization.acls; AlterUserScramCredentials (gh #252)
  # patches spec.authentication.scram.
  - apiGroups: [kaas.rs]
    resources: [kafkausers]
    verbs: [get, update, patch]
  # KafkaTopic: brokers watch + manage. The watch covers the
  # operator-driven path (kubectl apply -f); create/delete cover
  # the admin-protocol path (gh #51) where Kafbat / kafka-topics.sh
  # / Java AdminClient calls CreateTopics/DeleteTopics on the broker
  # and the broker's TopicCRWriter writes the CR. `patch` covers
  # CreatePartitions (gh #52, key 37 — TopicCRWriter.ExpandTopic) and
  # IncrementalAlterConfigs (gh #9, key 44 — UpdateTopicConfig), both
  # merge patches of spec on an existing KafkaTopic CR.
  - apiGroups: [kaas.rs]
    resources: [kafkatopics]
    verbs: [get, list, watch, create, patch, delete]
  # gh #221 phase 3: AlterReplicaLogDirs flips the placement record
  # (status.volumeAssignments) after a partition move.
  - apiGroups: [kaas.rs]
    resources: [kafkatopics/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kaas.fullname" . }}-broker
  labels: {{- include "kaas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kaas.fullname" . }}-broker
subjects:
  - kind: ServiceAccount
    name: {{ include "kaas.brokerSAName" . }}
    namespace: {{ .Release.Namespace }}
---
# Own-namespace Role: pods/status. No Secrets — TLS material and
# credentials arrive by volume mount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaas.fullname" . }}-broker
  labels: {{- include "kaas.labels" . | nindent 4 }}
rules:
  # ReadinessGate updates — own pod only (k8s scopes automatically).
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaas.fullname" . }}-broker
  labels: {{- include "kaas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaas.fullname" . }}-broker
subjects:
  - kind: ServiceAccount
    name: {{ include "kaas.brokerSAName" . }}
    namespace: {{ .Release.Namespace }}
