# gh #291 CI case: an external listener whose TLS Secret is brought by
# the operator of the cluster (certManager explicitly off) and with no
# gateway or service block, both of which are optional. Must render.
listeners:
  - name: plain
    port: 9092
    type: internal
    tls: false
    authentication:
      type: none
  - name: external
    port: 9093
    type: external
    tls: true
    hostnamePattern: "broker-%d.kafka.example.com"
    certManager:
      enabled: false
    authentication:
      type: none
